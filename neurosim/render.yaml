services:
  - type: web
    name: neurosim-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://neurosimv11.vercel.app"]'
      - key: MIROFISH_USE_REAL
        value: "false"
      - key: TRIBE_USE_REAL
        value: "false"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
