services:
  - type: web
    name: neurosim-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      - key: TRIBE_USE_REAL
        value: "false"
      - key: MIROFISH_USE_REAL
        value: "false"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: STAGEGATE_THRESHOLD
        value: "0.4"
      - key: PREMIUM_ENABLED
        value: "false"
      - key: PREMIUM_MAX_ANALYSES_FREE
        value: "10"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: cron
    name: warmup-cache
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: ""
    startCommand: python warmup_cron.py
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
