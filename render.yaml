services:
  - type: web
    name: neurosim-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: '["http://localhost:3000", "https://neurosimai-skg200257.vercel.app"]'
      - key: API_VERSION
        value: "v1"
      - key: TRIBE_USE_REAL
        value: "false"
      - key: MIROFISH_USE_REAL
        value: "false"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: STAGEGATE_THRESHOLD
        value: "0.4"
      - key: PREMIUM_ENABLED
        value: "false"
      - key: PREMIUM_MAX_ANALYSES_FREE
        value: "10"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: POSTHOG_HOST
        value: "https://us.i.posthog.com"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_YEARLY
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: cron
    name: warmup-cache
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: ""
    startCommand: python warmup_cron.py
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
